<div class="container py-4" style="max-width: 600px">
  <h2>01Blog — Feed</h2>
  <hr />
  <a href="/create-post" class="text-secondary">+ New Post</a>
  <hr />

  @for (post of posts; track post.id) {
    <div class="mb-4 pb-3 border-bottom">
      <a [routerLink]="['/profile', post.author.id]" class="fw-bold text-decoration-none">
        {{ post.author.username }}
      </a>
      <span class="text-secondary small ms-2">{{ formatDate(post.createdAt) }}</span>
      <p class="mt-2">{{ post.description }}</p>
      @if (post.mediaUrl) {
        <img
          [src]="'http://localhost:8080' + post.mediaUrl"
          class="img-fluid"
          style="max-height: 300px; object-fit: contain"
        />
      }
      <div class="mt-2">
        <button class="btn btn-sm btn-outline-secondary" (click)="toggleLike(post)">
          ♥ {{ post.likeCount }}
        </button>
      </div>
      <div class="mt-2">
        @for (comment of post.comments; track comment.id) {
          <div class="small mb-1">
            <strong>{{ comment.user.username }}</strong
            >: {{ comment.content }}
          </div>
        }
        <div class="input-group mt-2" style="max-width: 400px">
          <input
            [(ngModel)]="commentInputs[post.id]"
            class="form-control form-control-sm"
            placeholder="Add a comment..."
          />
          <button class="btn btn-sm btn-outline-secondary" (click)="addComment(post)">Post</button>
        </div>
      </div>
    </div>
  }
</div>
