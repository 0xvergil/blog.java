<div style="max-width: 600px; margin: 40px auto; font-family: monospace;">
  <h2>User Profile</h2>

  @if (!isOwnProfile) {
    <button (click)="toggleSubscription()" style="cursor: pointer;">
      {{ isSubscribed ? 'Unsubscribe' : 'Subscribe' }}
    </button>
    <button (click)="showReportForm = !showReportForm" style="cursor: pointer; margin-left: 8px;">Report</button>

    @if (showReportForm) {
      <div style="margin-top: 10px;">
        <textarea [(ngModel)]="reportReason" rows="3" placeholder="Reason for report..." style="width: 100%;"></textarea><br>
        <button (click)="submitReport()" style="cursor: pointer;">Submit Report</button>
        <button (click)="showReportForm = false" style="cursor: pointer; margin-left: 8px;">Cancel</button>
      </div>
    }

    @if (reportSuccess) {
      <p style="color: green;">Report submitted.</p>
    }
  }

  <hr>

  @for (post of posts; track post.id) {
    <div style="margin-bottom: 20px; border-bottom: 1px solid #ccc; padding-bottom: 10px;">
      <strong>{{ post.author.username }}</strong>
      <p>{{ post.description }}</p>
      @if (post.mediaUrl) {
        <img [src]="'http://localhost:8080' + post.mediaUrl" style="max-width: 100%; max-height: 400px; object-fit: contain;">
      }
      <div style="margin-top: 8px;">
        <span>♥ {{ post.likeCount }}</span>
      </div>
    </div>
  }

  @if (posts.length === 0) {
    <p>No posts yet.</p>
  }
</div>
