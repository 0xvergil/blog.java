<nav
  style="
    font-family: monospace;
    padding: 8px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  "
>
  <a href="/feed" style="text-decoration: none"><strong>01Blog</strong></a>
  @if (username) {
    <div>
      <a routerLink="/notifications" style="text-decoration: none">
        🔔
        @if (unreadCount > 0) {
          <span>({{ unreadCount }})</span>
        }
      </a>
      <span style="margin: 0 8px">|</span>
      @if (isAdmin) {
        <a routerLink="/admin" style="text-decoration: none">admin</a>
        <span style="margin: 0 8px">|</span>
      }
      @if (userId) {
        <a [routerLink]="['/profile', userId]" style="text-decoration: none">{{ username }}</a>
      } @else {
        <span>{{ username }}</span>
      }
      <span style="margin: 0 8px">|</span>
      <a (click)="logout()" style="cursor: pointer">logout</a>
    </div>
  }
</nav>
<router-outlet />
