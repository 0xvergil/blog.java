<div class="container py-4" style="max-width: 600px">
  <h2>New Post</h2>
  <hr />

  <div class="mb-3">
    <label class="form-label">Description</label>
    <textarea class="form-control" [(ngModel)]="description" rows="4"></textarea>
  </div>

  <div class="mb-3">
    <label class="form-label">Media (optional)</label>
    <input
      type="file"
      class="form-control"
      (change)="onFileSelected($event)"
      accept="image/*,video/*"
    />
    @if (previewUrl) {
      <div class="mt-2">
        @if (isVideo) {
          <video [src]="previewUrl" controls style="max-width: 100%; max-height: 300px"></video>
        } @else {
          <img
            [src]="previewUrl"
            class="img-fluid mt-2"
            style="max-height: 300px; object-fit: contain"
          />
        }
      </div>
    }
  </div>

  <button class="btn btn-outline-secondary" (click)="submit()">Post</button>

  @if (error) {
    <p class="text-danger mt-2">{{ error }}</p>
  }
  @if (success) {
    <p class="text-success mt-2">Post created! <a routerLink="/feed">Back to feed</a></p>
  }
</div>
