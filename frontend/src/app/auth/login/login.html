<div class="container py-5" style="max-width: 350px">
  <h2>01Blog — Login</h2>
  <hr />

  <div class="mb-3">
    <label class="form-label">Username</label>
    <input
      type="text"
      class="form-control"
      autofocus
      [(ngModel)]="username"
      (keyup.enter)="login()"
    />
  </div>

  <div class="mb-3">
    <label class="form-label">Password</label>
    <input type="password" class="form-control" [(ngModel)]="password" (keyup.enter)="login()" />
  </div>

  <button class="btn btn-outline-secondary w-100" (click)="login()">Login</button>

  <p class="mt-3">No account? <a routerLink="/register">Register</a></p>
</div>
