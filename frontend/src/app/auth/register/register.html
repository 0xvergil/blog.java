<div class="container py-5" style="max-width: 350px">
  <h2>01Blog — Register</h2>
  <hr />

  <div class="mb-3">
    <label class="form-label">Username</label>
    <input type="text" class="form-control" [(ngModel)]="username" />
  </div>

  <div class="mb-3">
    <label class="form-label">Password</label>
    <input type="password" class="form-control" [(ngModel)]="password" />
  </div>

  <button class="btn btn-outline-secondary w-100" (click)="register()">Register</button>

  @if (error) {
    <p class="text-danger mt-2">{{ error }}</p>
  }
  @if (success) {
    <p class="text-success mt-2">Account created! <a routerLink="/login">Login</a></p>
  }

  <p class="mt-3">Already have an account? <a routerLink="/login">Login</a></p>
</div>
